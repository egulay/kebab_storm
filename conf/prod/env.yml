spark_config:
  spark.executor.memory: "24g"
  spark.python.worker.memory: "4g"
  # Iceberg example (uncomment when storage_provider is set to "iceberg"):
  # spark.sql.extensions: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
  # spark.sql.catalog.kebab: "org.apache.iceberg.spark.SparkCatalog"
  # spark.sql.catalog.kebab.type: "hadoop"
  # spark.sql.catalog.kebab.warehouse: "/data/kebab_storm/iceberg"

spark_master: "yarn"
enable_hive_support: true

kebab_storm_logging_location: "/var/log/kebab_storm"
default_data_location: "/data/kebab_storm"
